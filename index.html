<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر علوان | لوحة التحكم والمنتجات</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        /* تنسيق شبكة المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .product-item {
            background: #fff;
            border: 1px solid #e1e8ed;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            position: relative;
        }

        .product-item img {
            width: 100%;
            max-height: 180px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .product-price {
            color: #e74c3c;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 0.85rem;
        }

        .delete-btn:hover {
            background-color: #cc0000;
        }

        /* تنسيق نموذج لوحة الإدارة */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #27ae60;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #219150;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- قسم عرض منتجات المتجر -->
        <div class="card">
            <h2>منتجات المتجر</h2>
            <div id="productsGrid" class="products-grid">
                <!-- المنتجات ستظهر هنا تلقائياً -->
            </div>
        </div>

        <!-- قسم لوحة الإدارة (أدمن) -->
        <div class="card">
            <h2>لوحة الإدارة - إضافة منتج جديد</h2>
            <form id="addProductForm">
                <div class="form-group">
                    <input type="text" id="productName" placeholder="اسم المنتج" required>
                </div>
                <div class="form-group">
                    <input type="number" id="productPrice" placeholder="السعر" required>
                </div>
                <div class="form-group">
                    <input type="url" id="productImage" placeholder="رابط صورة المنتج (URL)">
                </div>
                <button type="submit" class="btn-submit">إضافة المنتج</button>
            </form>
        </div>

    </div>

    <script>
        // المنتجات الافتراضية إذا كانت هذه أول مرة يتم فتح الصفحة فيها
        const defaultProducts = [
            { id: 1, name: "تشيرت", price: 100, image: "https://via.placeholder.com/150" },
            { id: 2, name: "قميص", price: 200, image: "https://via.placeholder.com/150" }
        ];

        // جلب المنتجات من LocalStorage أو استخدام الافتراضية
        let products = JSON.parse(localStorage.getItem('myProducts')) || defaultProducts;

        const productsGrid = document.getElementById('productsGrid');
        const addProductForm = document.getElementById('addProductForm');

        // دالة لعرض المنتجات في الصفحة
        function renderProducts() {
            productsGrid.innerHTML = '';

            if (products.length === 0) {
                productsGrid.innerHTML = '<p style="text-align:center;">لا توجد منتجات حالياً</p>';
                return;
            }

            products.forEach((product, index) => {
                const productDiv = document.createElement('div');
                productDiv.className = 'product-item';
                
                // صورة افتراضية في حال عدم توفر صورة
                const imgUrl = product.image || 'https://via.placeholder.com/150?text=لا+توجد+صورة';

                productDiv.innerHTML = `
                    <img src="${imgUrl}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/150?text=خطأ+في+الصورة'">
                    <div class="product-title">${product.name}</div>
                    <div class="product-price">${product.price} جنيه</div>
                    <button class="delete-btn" onclick="deleteProduct(${index})">حذف المنتج</button>
                `;

                productsGrid.appendChild(productDiv);
            });

            // حفظ المنتجات في المتصفح
            localStorage.setItem('myProducts', JSON.stringify(products));
        }

        // إضافة منتج جديد عند إرسال النموذج
        addProductForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('productName').value;
            const price = document.getElementById('productPrice').value;
            const image = document.getElementById('productImage').value;

            const newProduct = {
                id: Date.now(),
                name: name,
                price: price,
                image: image
            };

            products.push(newProduct);
            renderProducts();

            // إعادة تصفير الإدخالات
            addProductForm.reset();
        });

        // دالة حذف منتج
        function deleteProduct(index) {
            if (confirm('هل أنت تأكد من حذف هذا المنتج؟')) {
                products.splice(index, 1);
                renderProducts();
            }
        }

        // تشغيل العرض الأول عند تحميل الصفحة
        renderProducts();
    </script>
</body>
</html>
