<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر علوان | Elwan Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        
        /* الهيدر العصري */
        header { background: linear-gradient(135deg, #1a252f, #2c3e50); color: #fff; padding: 30px 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        header h1 { font-size: 28px; font-weight: 900; margin-bottom: 5px; letter-spacing: 1px; }
        header p { font-size: 14px; color: #bdc3c7; }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        
        .section-title { font-size: 22px; font-weight: 700; color: var(--primary); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: ''; width: 6px; height: 22px; background-color: var(--accent); border-radius: 3px; }

        /* شبكة المنتجات */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .product-card { background: var(--card-bg); border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); overflow: hidden; transition: transform 0.3s ease, box-shadow 0.3s ease; border: 1px solid #eee; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .product-img-wrapper { width: 100%; height: 220px; overflow: hidden; background: #eee; }
        .product-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .product-card:hover .product-img { transform: scale(1.05); }
        .product-info { padding: 20px; text-align: right; }
        .product-title { font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
        .product-price { font-size: 18px; font-weight: 900; color: var(--accent); }

        /* لوحة الإدارة الحديثة */
        .admin-panel { background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; margin-top: 50px; }
        .form-group { margin-bottom: 15px; }
        .admin-panel input { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.3s; }
        .admin-panel input:focus { border-color: var(--accent); }
        .admin-panel button { background: var(--accent); color: #fff; border: none; padding: 14px; font-size: 16px; font-weight: 700; border-radius: 8px; cursor: pointer; width: 100%; transition: background 0.3s; box-shadow: 0 4px 12px rgba(230, 126, 34, 0.3); }
        .admin-panel button:hover { background: #d35400; }

        .loading, .empty-msg { text-align: center; color: #7f8c8d; grid-column: 1 / -1; padding: 40px; font-size: 16px; }
    </style>
</head>
<body>

    <header>
        <h1>متجر علوان</h1>
        <p>وجهتك الأولى للتسوق الراقي والأنيق</p>
    </header>

    <div class="container">
        <h2 class="section-title">أحدث المنتجات</h2>
        <div id="products-container" class="products-grid">
            <div class="loading">جاري تحميل المنتجات...</div>
        </div>

        <div class="admin-panel">
            <h2 class="section-title">لوحة التحكم - إضافة منتج جديد</h2>
            <div class="form-group">
                <input type="text" id="product-name" placeholder="اسم المنتج">
            </div>
            <div class="form-group">
                <input type="number" id="product-price" placeholder="سعر المنتج (جنيه)">
            </div>
            <div class="form-group">
                <input type="text" id="product-img" placeholder="رابط صورة المنتج (URL)">
            </div>
            <button onclick="addProduct()">نشر المنتج في المتجر</button>
        </div>
    </div>

    <!-- Firebase SDKs & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCSewU1dCjcLObJq7vI3ZPaVRzN0Wp9b07",
          authDomain: "elwan-store-59b87.firebaseapp.com",
          projectId: "elwan-store-59b87",
          storageBucket: "elwan-store-59b87.firebasestorage.app",
          messagingSenderId: "951844473376",
          appId: "1:951844473376:web:ccf3e4597a90f2063d4s45"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addProduct = async function() {
            const name = document.getElementById('product-name').value;
            const price = document.getElementById('product-price').value;
            const imageUrl = document.getElementById('product-img').value;

            if(!name || !price) {
                alert('الرجاء إدخال اسم المنتج والسعر على الأقل!');
                return;
            }

            try {
                await addDoc(collection(db, "products"), {
                    name: name,
                    price: Number(price),
                    imageUrl: imageUrl || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500'
                });
                alert('تم إضافة المنتج بنجاح وتحديث المتجر!');
                document.getElementById('product-name').value = '';
                document.getElementById('product-price').value = '';
                document.getElementById('product-img').value = '';
                loadProducts();
            } catch (error) {
                console.error("خطأ أثناء الإضافة: ", error);
                alert('حدث خطأ أثناء إضافة المنتج: ' + error.message);
            }
        };

        async function loadProducts() {
            const container = document.getElementById('products-container');
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                container.innerHTML = '';
                if(querySnapshot.empty) {
                    container.innerHTML = '<div class="empty-msg">لا توجد منتجات مضافة حالياً. ابدأ بإضافة أول منتج عبر لوحة التحكم بالأسفل!</div>';
                    return;
                }
                querySnapshot.forEach((doc) => {
                    const p = doc.data();
                    container.innerHTML += `
                        <div class="product-card">
                            <div class="product-img-wrapper">
                                <img src="${p.imageUrl}" alt="${p.name}" class="product-img">
                            </div>
                            <div class="product-info">
                                <div class="product-title">${p.name}</div>
                                <div class="product-price">${p.price} جنيه</div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("خطأ في الجلب: ", error);
                container.innerHTML = '<div class="empty-msg">فشل تحميل المنتجات. تأكد من الاتصال.</div>';
            }
        }

        loadProducts();
    </script>
</body>
</html>
