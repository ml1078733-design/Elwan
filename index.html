<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAZ CLOTHING | متجر أزياء عصري</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Tajawal:wght@400;500;700&display=swap');
    body {
      font-family: 'Tajawal', 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-[#fafafa] text-[#111111] antialiased">

  <!-- شريط الإعلانات العلوي -->
  <div class="bg-black text-white text-xs py-2 text-center tracking-widest font-medium uppercase">
    شحن مجاني للطلبات فوق 1500 ج.م / ر.س • كود الخصم: <span class="font-bold underline">NAZ10</span>
  </div>

  <!-- الهيدر والنافيجيشن -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-neutral-100">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      
      <!-- اللوجو -->
      <a href="#" class="text-2xl font-extrabold tracking-tighter uppercase font-['Plus_Jakarta_Sans']">
        NAZ<span class="text-neutral-400">.</span>
      </a>

      <!-- روابط التصفح -->
      <nav class="hidden md:flex items-center space-x-8 space-x-reverse text-sm font-semibold tracking-wide">
        <a href="#products" class="hover:text-neutral-500 transition">كل المنتجات</a>
        <a href="#products" onclick="filterCategory('tshirt')" class="hover:text-neutral-500 transition">تيشيرتات</a>
        <a href="#products" onclick="filterCategory('hoodie')" class="hover:text-neutral-500 transition">هوديز</a>
        <a href="#products" onclick="filterCategory('pants')" class="hover:text-neutral-500 transition">بناطيل</a>
      </nav>

      <!-- الأيقونات (البحث والسلة) -->
      <div class="flex items-center space-x-5 space-x-reverse">
        <button onclick="toggleCart()" class="relative p-2 hover:bg-neutral-100 rounded-full transition">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
          <span id="cart-count" class="absolute -top-1 -right-1 bg-black text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full font-bold">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- البانر الرئيسي (Hero Section) -->
  <section class="relative h-[75vh] bg-neutral-900 text-white flex items-center justify-center overflow-hidden">
    <img src="https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&fit=crop&q=80&w=1600" 
         alt="Hero background" 
         class="absolute inset-0 w-full h-full object-cover opacity-40">
    
    <div class="relative z-10 text-center max-w-2xl px-4">
      <span class="text-xs uppercase tracking-widest text-neutral-300 font-semibold mb-2 block">تشكيلة خريف / شتاء 2026</span>
      <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-6">البساطة في أدق تفاصيلها</h1>
      <p class="text-neutral-300 text-sm md:text-base mb-8 font-normal leading-relaxed">
        تصاميم مصممة لتجمع بين الراحة والأناقة المينيمال، بأعلى خامات القطن الفاخر.
      </p>
      <a href="#products" class="inline-block bg-white text-black px-8 py-3.5 text-sm font-bold uppercase tracking-wider rounded-none hover:bg-neutral-200 transition">
        تسوق التشكيلة الآن
      </a>
    </div>
  </section>

  <!-- قسم المنتجات -->
  <main id="products" class="max-w-7xl mx-auto px-6 py-20">
    <div class="flex flex-col md:flex-row md:items-end justify-between mb-10 gap-4 border-b pb-6 border-neutral-200">
      <div>
        <h2 class="text-2xl font-bold tracking-tight">أحدث القطع</h2>
        <p class="text-neutral-500 text-sm mt-1">اكتشف آخر صيحات الموسم الحالي</p>
      </div>

      <!-- أزرار الفلترة -->
      <div class="flex flex-wrap gap-2 text-xs font-semibold">
        <button onclick="filterCategory('all')" class="cat-btn px-4 py-2 border border-black bg-black text-white rounded-none transition" data-cat="all">الكل</button>
        <button onclick="filterCategory('hoodie')" class="cat-btn px-4 py-2 border border-neutral-300 hover:border-black rounded-none transition" data-cat="hoodie">هوديز</button>
        <button onclick="filterCategory('tshirt')" class="cat-btn px-4 py-2 border border-neutral-300 hover:border-black rounded-none transition" data-cat="tshirt">تيشيرتات</button>
        <button onclick="filterCategory('pants')" class="cat-btn px-4 py-2 border border-neutral-300 hover:border-black rounded-none transition" data-cat="pants">بناطيل</button>
      </div>
    </div>

    <!-- شبكة المنتجات (Product Grid) -->
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
      <!-- يتم تعبئة المنتجات هنا تلقائياً بواسطة JavaScript -->
    </div>
  </main>

  <div id="cart-drawer" class="fixed inset-0 z-50 pointer-events-none transition-all duration-300">
    <!-- الخلفية المعتمة -->
    <div id="cart-backdrop" onclick="toggleCart()" class="absolute inset-0 bg-black/50 opacity-0 transition-opacity"></div>
    
    <!-- محتوى السلة -->
    <div id="cart-panel" class="absolute top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300 pointer-events-auto">
      
      <!-- رأس السلة -->
      <div class="p-6 border-b border-neutral-100 flex items-center justify-between">
        <h3 class="font-bold text-lg">سلة المشتريات</h3>
        <button onclick="toggleCart()" class="p-1 hover:bg-neutral-100 rounded-full transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
