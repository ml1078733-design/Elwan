<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر علوان | Elwan Store</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background-color: #f4f6f8; color: #333; margin: 0; padding: 0; }
        header { background-color: #111; color: #fff; padding: 20px; text-align: center; }
        header h1 { margin: 0; font-size: 24px; }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
        .section-title { margin-bottom: 20px; font-size: 20px; color: #444; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; padding: 15px; text-align: center; }
        .product-img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        .product-title { font-size: 18px; margin: 10px 0 5px; font-weight: bold; }
        .product-price { font-size: 16px; color: #e74c3c; margin-bottom: 15px; }
        .admin-panel { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 40px; }
        .admin-panel input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .admin-panel button { background: #27ae60; color: #fff; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; }
        .admin-panel button:hover { background: #219653; }
    </style>
</head>
<body>

    <header>
        <h1>متجر علوان | Elwan Store</h1>
    </header>

    <div class="container">
        <h2 class="section-title">منتجات المتجر</h2>
        <div id="products-container" class="products-grid">
            <!-- سيتم عرض المنتجات هنا ديناميكياً -->
        </div>

        <div class="admin-panel">
            <h2 class="section-title">لوحة الإدارة - إضافة منتج جديد</h2>
            <input type="text" id="product-name" placeholder="اسم المنتج">
            <input type="number" id="product-price" placeholder="السعر">
            <input type="text" id="product-img" placeholder="رابط صورة المنتج">
            <button onclick="addProduct()">إضافة المنتج</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات فايربيس الخاصة بك
        const firebaseConfig = {
          apiKey: "AIzaSyCSewU1dCjcLObJq7vI3ZPaVRzN0Wp9b07",
          authDomain: "elwan-store-59b87.firebaseapp.com",
          projectId: "elwan-store-59b87",
          storageBucket: "elwan-store-59b87.firebasestorage.app",
          messagingSenderId: "951844473376",
          appId: "1:951844473376:web:ccf3e4597a90f2063d4s45"
        };

        // تهيئة فايربيس وقاعدة البيانات
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // دالة إضافة منتج
        window.addProduct = async function() {
            const name = document.getElementById('product-name').value;
            const price = document.getElementById('product-price').value;
            const imageUrl = document.getElementById('product-img').value;

            if(!name || !price) {
                alert('الرجاء إدخال اسم المنتج والسعر على الأقل!');
                return;
            }

            try {
                await addDoc(collection(db, "products"), {
                    name: name,
                    price: Number(price),
                    imageUrl: imageUrl || 'https://via.placeholder.com/250'
                });
                alert('تم إضافة المنتج بنجاح!');
                document.getElementById('product-name').value = '';
                document.getElementById('product-price').value = '';
                document.getElementById('product-img').value = '';
                loadProducts();
            } catch (error) {
                console.error("خطأ أثناء الإضافة: ", error);
                alert('حدث خطأ أثناء إضافة المنتج: ' + error.message);
            }
        };

        // دالة جلب وعرض المنتجات
        async function loadProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '<p>جاري تحميل المنتجات...</p>';
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                container.innerHTML = '';
                if(querySnapshot.empty) {
                    container.innerHTML = '<p>لا توجد منتجات مضافة حالياً.</p>';
                    return;
                }
                querySnapshot.forEach((doc) => {
                    const p = doc.data();
                    container.innerHTML += `
                        <div class="product-card">
                            <img src="${p.imageUrl}" alt="${p.name}" class="product-img">
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">${p.price} جنيه</div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("خطأ في الجلب: ", error);
                container.innerHTML = '<p>فشل تحميل المنتجات.</p>';
            }
        }

        // تشغيل الدالة عند فتح الصفحة
        loadProducts();
    </script>
</body>
</html>
